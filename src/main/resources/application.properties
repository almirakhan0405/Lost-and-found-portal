spring.application.name=smart-lost-found-portal
spring.main.banner-mode=off
server.port=${PORT:8080}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# Embedded H2 database stored in the ./data folder (survives restarts)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/lostfound;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Browser DB viewer at /h2-console - OFF by default (never expose it publicly). Locally: set env H2_CONSOLE=true
spring.h2.console.enabled=${H2_CONSOLE:false}

# Set to false to skip demo data on first start
app.seed=true

# Open the Swing desktop window after start-up (the Dockerfile sets APP_DESKTOP=false)
app.desktop=true
